apis:
- aid: canix:canix-mcp
  name: Canix MCP Server
  description: >-
    Canix's hosted Model Context Protocol server, announced 2026-07-09, connects Canix account data to
    AI assistants such as Claude and ChatGPT. It is published as an OAuth 2.1 protected resource at https://api.canix.com/mcp,
    advertised through RFC 9728 protected-resource metadata and an RFC 8414 authorization-server document
    on api.canix.com with dynamic client registration, PKCE (S256) and a single `mcp` scope. Sales reporting
    is live; inventory access is announced as coming soon. The tools/list manifest is authenticated, so
    the live tool schemas are not publicly readable.
  humanURL: https://www.canix.com/blog-posts/ask-your-data-anything-canix-launches-mcp-server
  baseURL: https://api.canix.com/mcp
  tags:
  - MCP
  - AI
  - Cannabis
  - Reporting
  properties:
  - type: MCPServer
    url: mcp/canix-mcp.yml
  - type: ToolCrosswalk
    url: mcp/canix-tool-crosswalk.yml
