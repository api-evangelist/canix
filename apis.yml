aid: canix
name: Canix
description: Canix is a cannabis enterprise resource planning (ERP) and seed-to-sale platform used by
  licensed cultivators, manufacturers and distributors to run cultivation, processing, inventory, sales
  and compliance operations. The product covers plant and plant-batch tracking, harvests, packages, bills
  of materials, manufacturing batches and runs, purchase orders, sales orders, customers, vendors, standard
  costing and business intelligence reporting, with deep Metrc and BioTrack track-and-trace synchronization
  plus RFID and scale hardware support. Canix publishes a public OpenAPI 3.0.3 contract for its REST API
  at api.canix.com, and in July 2026 launched a hosted Model Context Protocol (MCP) server that lets AI
  assistants query Canix sales and inventory data in natural language.
