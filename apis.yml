apis:
- aid: canix:canix-api
  name: Canix API
  description: The Canix REST API exposes a cannabis operator's Canix account data to third-party developers
    — sales orders, payments, customers, vendors, purchase orders, items, item types, brands, strains,
    locations, facilities, packages, plants, plant batches, harvests, transfers, transfer destinations,
    non-cannabis products, bills of materials, manufacturing batches and runs, standard costs, weight
    units and audited actions. Authentication is a company-scoped API key sent in the X-API-KEY header.
    Collection endpoints share a common limit/offset/order_by/where query grammar where `where` accepts
    SQL-like filter expressions.
  humanURL: https://www.canix.com/product/api
  baseURL: https://api.canix.com/api/v1
