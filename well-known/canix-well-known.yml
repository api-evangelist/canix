findings:
  oauth_issuer: https://api.canix.com
  protected_resource: https://api.canix.com/mcp
  scopes_supported:
  - mcp
  dynamic_client_registration: https://api.canix.com/oidc/register
  pkce: S256
  grant_types:
  - authorization_code
  - refresh_token
  note: >-
    The openid-configuration and oauth-authorization-server documents are byte-identical.
    Canix advertises an OIDC discovery path but the document is an OAuth 2.0 authorization
    server metadata document — it carries no jwks_uri, userinfo_endpoint, subject_types_supported
    or id_token_signing_alg_values_supported, all of which OpenID Connect Discovery 1.0 requires.
    Treat it as RFC 8414 metadata served at the OIDC path, not as an OIDC provider.
