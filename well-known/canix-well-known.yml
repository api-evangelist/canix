method: probed
source: live GET of /.well-known/* on every Canix host
description: >-
  Canix serves a complete OAuth 2.1 discovery surface from api.canix.com. It exists to
  support the hosted MCP server at https://api.canix.com/mcp — the protected-resource
  document names that endpoint explicitly. There is no security.txt, no api-catalog, no
  ai-plugin.json, and no A2A agent card on any Canix host.
