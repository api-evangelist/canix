openapi: 3.2.0
info:
  title: Canix Items API
  x-logo:
    url: https://assets.website-files.com/5ee52a0f4be6ffc2aaeb52cd/5ee52a0f4be6ff20e7eb534f_canix-logo.svg
    backgroundColor: '#FFFFFF'
    altText: Canix logo
  description: '# Introduction

    This API documentation describes the endpoints used by third-party developers to get Canix data for their account.

    # Authentication

    Canix API uses API Keys for authentication. You can generate an API key on our API page, and on your API requests use the `X-API-KEY` header with the API key value you generated.

    We strongly recommend using a secrets manager. Plain text files like dotenv lead to accidental costly leaks. Use Doppler or similar options for a developer friendly experience. AWS and Google Cloud have native solutions as well.'
  contact:
    name: Canix Support
    url: https://help.canix.com/
    email: help@canix.com
  version: 1.3.11
servers:
- url: https://api.canix.com/api/v1
  variables: {}
security:
- ApiKeyAuth: []
tags:
- name: Items
paths:
  /items:
    get:
      tags:
      - Items
      summary: GetItems
      description: Return items
      operationId: GetItems
      parameters:
      - name: facility_id
        in: query
        description: Facility ID (optional)
        example: 123
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/orderByParam'
      - $ref: '#/components/parameters/whereParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    post:
      tags:
      - Items
      summary: CreateItem
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: CreateItem
      requestBody:
        required: true
        description: Create a new Item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateItemRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
  /items/{item_id}:
    get:
      tags:
      - Items
      summary: GetItem
      description: Get Item by ID
      operationId: GetItemById
      parameters:
      - name: item_id
        in: path
        description: Item ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    put:
      tags:
      - Items
      summary: UpdateItem
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: UpdateItem
      parameters:
      - name: item_id
        in: path
        description: ID of Item to update
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        description: Update an existing Item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateItemRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    delete:
      tags:
      - Items
      summary: Delete Item
      description: '__CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__


        Deletion is routed through a submission, so the response tells you how far it got. A `200` means the

        submission finished and the item is included in its deleted state; a `202` means the submission is still

        being processed and only the submission is returned — poll it with `GET /submissions/{submission_id}`.'
      operationId: DeleteItem
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The submission succeeded and the item was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDeletionResult'
        '202':
          description: The submission was queued and has not finished yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDeletionResult'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          description: The submission failed; `submission.error_message` carries the reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDeletionResult'
        '500':
          $ref: '#/components/responses/500ServerError'
  /items/{item_id}/standard_cost:
    post:
      tags:
      - Items
      summary: AddItemStandardCost
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: AddItemStandardCost
      parameters:
      - name: item_id
        in: path
        description: ID of Item to add standard cost
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        description: Add standard cost to an Item
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemStandardCostRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemStandardCost'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
  /items/{item_id}/standard_costs:
    get:
      tags:
      - Items
      summary: GetItemStandardCosts
      description: Return every standard cost recorded for the item, newest start date first
      operationId: GetItemStandardCosts
      parameters:
      - name: item_id
        in: path
        description: Item ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemStandardCost'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
  /items/photos:
    post:
      tags:
      - Items
      summary: Create METRC Item Photos
      operationId: CreateMETRCItemPhotos
      requestBody:
        required: true
        description: Create METRC Item Photos
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMETRCItemPhotosRequestBody'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                properties:
                  photo_ids:
                    type: array
                    description: IDs of the photos that were created
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '500':
          $ref: '#/components/responses/500ServerError'
  /items/files:
    post:
      tags:
      - Items
      summary: Create METRC Item Files
      operationId: CreateMETRCItemFiles
      requestBody:
        required: true
        description: Create METRC Item Files
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMETRCItemFilesRequestBody'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                properties:
                  file_ids:
                    type: array
                    description: IDs of the files that were created
                    items:
                      type: integer
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '500':
          $ref: '#/components/responses/500ServerError'
components:
  responses:
    403AccessDenied:
      description: Access denied
    401NotAuthenticated:
      description: Not authenticated
    404NotFound:
      description: The specified resource was not found
    500ServerError:
      description: Server error
    400BadRequest:
      description: Bad request
  schemas:
    Submission:
      title: Submission
      description: 'A submission represents an asynchronous action (such as creating a package, adjusting inventory,

        submitting a transfer, etc.) that may be pending, successful, failed, or require approval.

        '
      type: object
      required:
      - uuid
      - status
      - created_at
      properties:
        uuid:
          type: string
          description: The unique identifier for the submission
          example: U3VibWlzc2lvbjo0NTY3ODk=
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        readable_name:
          type:
          - string
          - 'null'
          description: Human-readable name describing the submission action
          example: Create Package
        description:
          type: string
          description: Detailed description of the submission, may include multiple lines
          example: 'Package created from harvest

            Tag: 1A40000000000000001'
        error_message:
          type: string
          description: Error message if the submission failed, empty string otherwise
          example: ''
        result:
          type:
          - object
          - 'null'
          description: Result data from a successful submission (e.g., created record IDs)
          additionalProperties: true
          example:
            package_id: 12345
            tag: 1A40000000000000001
        created_at:
          type: string
          format: date-time
          description: When the submission was created
          example: '2024-01-15T10:30:00.000Z'
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the submission was last executed (null if not yet run)
          example: '2024-01-15T10:30:05.000Z'
      example:
        uuid: U3VibWlzc2lvbjo0NTY3ODk=
        status: SUCCESS
        readable_name: Create Package
        description: 'Package created from harvest

          Tag: 1A40000000000000001'
        error_message: ''
        result:
          package_id: 12345
          tag: 1A40000000000000001
        created_at: '2024-01-15T10:30:00.000Z'
        last_run_at: '2024-01-15T10:30:05.000Z'
    SubmissionStatus:
      title: Submission Status
      type: string
      description: 'The current status of the submission:

        - **CREATED**: Transaction queued for processing

        - **PENDING_APPROVAL**: Transaction awaiting admin approval

        - **PENDING**: Transaction pending response from compliance system

        - **RETRYING**: Transaction failed but will be automatically retried

        - **FAILED**: Transaction failed permanently

        - **SUCCESS**: Transaction completed successfully

        - **DENIED**: Transaction was reviewed by an admin and denied

        - **ABORTED**: Transaction has been aborted

        - **PARTIAL_FAILURE**: Some steps succeeded but others failed

        '
      enum:
      - CREATED
      - PENDING_APPROVAL
      - PENDING
      - RETRYING
      - FAILED
      - SUCCESS
      - DENIED
      - ABORTED
      - PARTIAL_FAILURE
      example: SUCCESS
    ItemDeletionResult:
      title: Item Deletion Result
      description: 'The outcome of an item deletion. `item` is only present once the submission has succeeded, so a `202`

        response carries the submission alone.

        '
      type: object
      required:
      - submission
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        item:
          $ref: '#/components/schemas/Item'
    CreateMETRCItemPhotosRequestBody:
      title: CreateMETRCItemPhotosRequestBody
      required:
      - facility_id
      - photos
      properties:
        facility_id:
          type: integer
        photos:
          type: array
          items:
            type: object
            properties:
              attachment_type:
                enum:
                - product
                - label
                - packaging
                description: 'The type of attachment intended for the item. Must be one of the following: product, label, packaging'
              filename:
                type: string
              encoded_image_base64:
                type: string
                description: A Base64 string containing the encoded image
    CreateMETRCItemFilesRequestBody:
      title: CreateMETRCItemFileRequestBody
      required:
      - facility_id
      - files
      properties:
        facility_id:
          type: integer
        files:
          type: array
          items:
            type: object
            properties:
              filename:
                type: string
              encoded_file_base64:
                type: string
                description: A Base64 string containing the encoded file
    Item:
      title: Item
      required:
      - id
      - name
      - facility_id
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_active:
          type: boolean
        item_type:
          type: string
        brand:
          $ref: '#/components/schemas/IdName'
        product_id:
          type: integer
          description: ID of the active Product this item belongs to, if any
        product_brand:
          $ref: '#/components/schemas/IdName'
        quantity_type:
          type: string
        sku:
          type: string
        current_standard_cost:
          $ref: '#/components/schemas/ItemStandardCost'
        accounting_inventory_type:
          type: string
        notes:
          type: string
        facility_id:
          type: integer
        strain:
          $ref: '#/components/schemas/Strain'
        type:
          $ref: '#/components/schemas/ItemType'
        sub_type:
          $ref: '#/components/schemas/ItemSubType'
        weight_unit:
          type: string
        unit_weight:
          type: number
        unit_weight_unit:
          type: string
        case_quantity:
          type: string
        case_quantity_unit:
          type: string
        unit_cbd_weight:
          type: number
        unit_cbd_weight_unit:
          type: string
        unit_thc_weight:
          type: number
        unit_thc_weight_unit:
          type: string
        unit_cbd_percent:
          type: number
        unit_thc_percent:
          type: number
        description:
          type: string
        serving_size:
          type: number
        number_of_doses:
          type: number
        public_ingredients:
          type: string
        supply_duration_days:
          type: number
        administration_method:
          type: string
        allergens:
          type: string
        transfer_source_license:
          type: string
          description: Facility license number of the originating facility. Non-editable.
        bills_of_materials:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
              name:
                type: string
              package_weight:
                type: number
              unit:
                type: string
        sage_item:
          type: object
          properties:
            external_id:
              type: string
            name:
              type: string
        leaflink_item:
          type: object
          properties:
            external_id:
              type: string
            name:
              type: string
        dutchie_product:
          type: object
          properties:
            external_id:
              type: string
            name:
              type: string
        phenotype:
          type: string
        total_for_sale:
          type: number
          description: Total quantity marked as available to sell
        ordered:
          type: number
          description: Total quantity ordered from in-progress sales orders
        backordered:
          type: number
          description: Total quantity backordered from in-progress sales orders
        unordered:
          type: number
          description: Quantity available to sell minus ordered quantity (minimum 0)
        updated_at:
          type: string
          example: 2018-11-06 08:00:00+00:00
      example:
        id: 7036
        name: Blue Dream - Trim
        sku: '22657'
        current_standard_costing:
          id:
            type: integer
            example: 123
          standard_cost_amount:
            type: number
            example: 12.1111
          standard_cost_currency:
            type: string
            example: USD
          start_date:
            type: string
            example: '2023-04-19'
          end_date:
            type: string
          example: '2023-05-19'
        is_active: true
        facility_id: 14
        type:
          id: 884
          name: Clone - Cutting
          quantity_type: CountBased
          product_category: Plants
        sub_type: null
        brand: null
        product_id: 512
        product_brand: null
        quantity_type: CountBased
        notes: ''
        accounting_inventory_type: raw_materials
        strain: null
        weight_unit: Each
        unit_weight: 10
        unit_weight_unit: Grams
        case_quantity: 100
        case_unit: Each
        description: Clone
        allergens: Can s 2
        transfer_source_license: '1234567890'
        bills_of_materials:
        - url: https://www.app.canix.com/inventory/non-cannabis/bill-of-materials/123
          name: Bill of Materials
          package_weight: 10
          unit: g
        sage_item:
          external_id: '1234567890'
          name: Sage Item
        leaflink_item: null
        dutchie_product: null
        phenotype: Indica
        total_for_sale: 100
        ordered: 25
        backordered: 10
        unordered: 75
        updated_at: '2021-03-16T23:49:03.175Z'
    UpdateItemRequestBody:
      title: Item Update Request Body
      type: object
      properties:
        name:
          type: string
          example: Blue Dream
          description: The name of the item
        is_active:
          type: boolean
          example: true
          description: Whether the item is active
        item_category_id:
          type: integer
          example: 1
          description: ID of the item category
        item_sub_category_id:
          type: integer
          example: 2
          description: ID of the item sub category
        brand_id:
          type: integer
          example: 3
          description: ID of the brand
        description:
          type: string
          example: High quality strain
          description: Description of the item
        notes:
          type: string
          example: Internal notes about the item
        sku:
          type: string
          example: BD-001
          description: Stock keeping unit identifier
        serving_size:
          type: string
          example: 1g
          description: Size of a single serving
        number_of_doses:
          type: integer
          example: 10
          description: Number of doses in the item
        unit_thc_weight:
          type: number
          format: float
          example: 10.5
          description: THC weight per unit
        unit_cbd_weight:
          type: number
          format: float
          example: 5.2
          description: CBD weight per unit
        unit_thc_percent:
          type: number
          example: 18.5
          description: THC percentage
        unit_cbd_percent:
          type: number
          example: 2.5
          description: CBD percentage
        public_ingredients:
          type: string
          example: Cannabis
          description: Public list of ingredients
        supply_duration_days:
          type: integer
          example: 30
          description: Duration of supply in days
        administration_method:
          type: string
          example: Oral
          description: Method of administration
        photo_ids:
          type: array
          items:
            type: integer
          example:
          - 1
          - 2
          - 3
          description: IDs of photos to associate with the item
        metrc_item_brand:
          type: string
          example: 'Brand #1'
          description: Item Brand for METRC
    ItemType:
      title: ItemType
      required:
      - id
      - name
      - facility_id
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        quantity_type:
          type: string
        requires_strain:
          type: boolean
        requires_unit_volume:
          type: boolean
        requires_unit_weight:
          type: boolean
        requires_unit_thc_weight:
          type: boolean
        requires_unit_cbd_weight:
          type: boolean
        requires_unit_cbd_percent:
          type: boolean
        requires_unit_thc_percent:
          type: boolean
        requires_public_ingredients:
          type: boolean
        requires_administration_method:
          type: boolean
        requires_serving_size:
          type: boolean
        requires_supply_duration_days:
          type: boolean
        requires_number_of_doses:
          type: boolean
        updated_at:
          type: string
          example: 2018-11-06 08:00:00+00:00
    ItemStandardCost:
      title: ItemStandardCost
      required:
      - id
      - cost
      - start_date
      properties:
        id:
          type: integer
          example: 123
        cost:
          type: number
          description: The standard cost, in the company's currency
          example: 12.1111
        start_date:
          type: string
          example: '2023-04-19'
        end_date:
          type:
          - string
          - 'null'
          example: '2023-05-19'
        item:
          type: object
          description: The item the cost belongs to. Omitted where a standard cost is embedded in an item.
          properties:
            id:
              type: integer
              example: 123
            name:
              type: string
              example: Blue Dream 1g Preroll
            sku:
              type:
              - string
              - 'null'
              example: BD-PR-1G
    ItemSubType:
      title: ItemSubType
      required:
      - id
      - name
      - weight_unit
      - item_category
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        weight_unit:
          type: string
        category:
          $ref: '#/components/schemas/ItemType'
        updated_at:
          type: string
          example: 2018-11-06 08:00:00+00:00
    IdName:
      title: IdName
      type: object
      properties:
        id:
          type: number
        name:
          type: string
    Strain:
      title: Strain
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
          example: Lemon Skunk
          description: Strain name
        facility_id:
          type: integer
          example: 123
          description: ID of the facility the strain belongs to
        notes:
          type: string
          example: Terpenes .63%
          description: Notes
        sku:
          type: string
          example: BIOJJ
          description: SKU
        testing_status:
          type: string
          example: InHouse
          description: 'Testing status: InHouse, ThirdParty, None, NA'
        indica_percent:
          type:
          - number
          - 'null'
          example: 45.0
          description: Indica Percentage
        sativa_percent:
          type:
          - number
          - 'null'
          example: 55.0
          description: Sativa Percentage
        indica_percentage:
          type:
          - number
          - 'null'
          example: 45.0
          description: Indica Percentage (same value as indica_percent)
        sativa_percentage:
          type:
          - number
          - 'null'
          example: 55.0
          description: Sativa Percentage (same value as sativa_percent)
        cross_strains:
          type: array
          description: Cross strains
          items:
            $ref: '#/components/schemas/CrossStrain'
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update
    ItemStandardCostRequestBody:
      title: Item Standard Cost Request Body
      type: object
      required:
      - cost
      - start_date
      properties:
        cost:
          type: number
          format: float
          description: The standard cost value to be set
          example: 10.5
        start_date:
          type: string
          format: date-time
          description: When this standard cost becomes effective
          example: '2024-02-03T00:00:00Z'
        end_date:
          type: string
          format: date-time
          description: Optional. When this standard cost expires
          example: '2024-12-31T23:59:59Z'
    CrossStrain:
      title: Cross Strain
      required:
      - id
      - name
      properties:
        id:
