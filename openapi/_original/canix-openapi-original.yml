  /customers/{customer_id}/credits:
    post:
      tags:
        - Customers
      summary: AdjustCustomerCredit
      description: >-
        Adjust the customer's credit balance. A negative amount reduces the balance.
        The balance can be applied to sales orders after taxes via the `credits` and
        `pull_credit_from_customer` fields on sales order create/update.
      operationId: AdjustCustomerCredit
      parameters:
        - name: customer_id
          in: path
          description: Customer ID
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: number
                  description: Amount to add to the customer's credit balance (negative to reduce)
                  example: 1000.0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer_id:
                    type: integer
                  credit:
                    type: number
                    description: The customer's new credit balance
              example:
                customer_id: 345
                credit: 1000.0
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
