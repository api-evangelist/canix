components:
  schemas:
    AuditedAction:
      title: Audited Action
      type: object
      properties:
        facility_id:
          type: integer
        object_id:
          type: integer
        object_type:
          type: string
        object_tag:
          type: string
        context:
          type: array
          items:
            type: string
        description:
          type: string
        submitted_date:
          type: string
          example: 2018-11-06T08:00:00.000Z
        approval_date:
          type: string
          example: 2018-11-06T08:00:00.000Z
        created_at:
          type: string
          example: 2018-11-06T08:00:00.000Z
        updated_at:
          type: string
          example: 2018-11-06T08:00:00.000Z

    SalesOrder:
      title: Sales Order
      required:
        - id
        - facility_id
        - name
        - status
        - delivery_date
        - other_tax_rate
        - local_tax_rate
        - state_tax_rate
      type: object
      properties:
        id:
          type: integer
        facility_id:
          type: integer
          description: Facility ID (fk)
        name:
          type: string
        external_identifier:
          type: string
          description: External Sales Order ID (from partner system, not unique)
        status:
          type: string
          description: >-
            status, can be one of 'created', 'approved', 'filled', 'shipped', 'rejected', 'accepted', 'archived',
            'requested'
        created_at:
          type: string
          description: Timestamp that the record was created in Canix
        customer:
          $ref: "#/components/schemas/Customer"
        delivery_date:
          type: string
        delivery_fee:
          type: number
        payment_date:
          type: string
          description: Payment due date
        payment_terms:
          type: string
        local_tax_rate:
          type: number
        state_tax_rate:
          type: number
        other_tax_rate:
          type: number
        subtotal:
          type: number
          description: Subtotal of all items
        total_cultivation_tax:
          type: number
        total_price:
          type: number
          description: Total price (with taxes)
        total_paid:
          type: number
        credits:
          type: number
          description: >-
            Customer credit applied to this order, as a positive number. Credits are applied
            after taxes, so they do not reduce the taxable subtotal. Writable on create/update
            via the `credits` request field.
        discount:
          type: number
          description: >-
            Order-level discount amount (from `sales_order_credit`), as a positive number.
            Discounts are applied before taxes and reduce the taxable subtotal.
        remaining_balance:
          type: number
        internal_notes:
          type: string
        payments:
          description: Payments collected for this order
          type: array
          items:
            $ref: "#/components/schemas/SalesOrderPayment"
        sales_order_credit:
          $ref: "#/components/schemas/Discount"
        display_status:
          type: string
          description: The display status of the order. This is the custom status name if set, otherwise the standard status value.
        contents:
          description: Contents of the order (i.e. line items)
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/SalesOrderItem"
              - type: object
                properties:
                  weight_unit_id:
                    type: integer
                  weight_unit_name:
                    type: string
        sales_representative:
          schema:
          $ref: "#/components/schemas/User"
        invoice_url:
          type: string
          description: URL to the latest invoice if it exists
          example: https://www.app.canix.com/sales/invoice/view/123456
        updated_at:
          type: string
          example: 2018-11-06T08:00:00.000Z
      example:
        id: 84
        name: 0000002062
        external_identifier: "SAP-ORDER-12345"
        facility_id: 14
        status: created
        customer:
          id: 345
          contact_name: John Smith
          company_name: Zen Ltd
          facility_license_number: 2020124
          license_type: 3
          customer_number: 247123
          updated_at: 2020-04-24T02:18:42.703Z
          license_expiration_date: 2020-04-24
          phone: 1222312
          email: john.doe@twww.com",
          territory: abc
