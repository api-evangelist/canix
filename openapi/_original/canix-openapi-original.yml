openapi: 3.0.3
info:
  title: Canix API
  x-logo:
    url: https://assets.website-files.com/5ee52a0f4be6ffc2aaeb52cd/5ee52a0f4be6ff20e7eb534f_canix-logo.svg
    backgroundColor: "#FFFFFF"
    altText: Canix logo
  description: >-
    # Introduction

    This API documentation describes the endpoints used by third-party developers to get Canix data for their account.

    # Authentication

    Canix API uses API Keys for authentication. You can generate an API key on our [API page](https://app.canix.com/company/api), and on your API requests use the `X-API-KEY` header with the API key value you generated.

    We strongly recommend using a secrets manager. Plain text files like dotenv lead to accidental costly leaks. Use
    [Doppler](https://doppler.com/) or similar options for a developer friendly experience. AWS and Google Cloud have native solutions as
    well.
  contact:
    name: Canix Support
    url: https://help.canix.com/
    email: help@canix.com
  version: "1.3.10"
servers:
  - url: https://api.canix.com/api/v1
    variables: {}

paths:
  /audited_actions:
    get:
      tags:
        - Audited Actions
      summary: GetAuditedActions
      description: Returns Package Adjustments, Package Splits, Package Combines, Location Changes for Plant Batches, Plants and Packages, Immatures Destroyed in Plant Batches, Submitted by Email, Submitted by Name, Approved by Email and Approved by Name

      operationId: GetAuditedActions
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - $ref: "#/components/parameters/orderByParam"
        - $ref: "#/components/parameters/whereParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditedAction"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

  /sales_orders:
    get:
      tags:
        - Sales Orders
      summary: GetSalesOrders
      description: Return Sales Orders

      operationId: GetSalesOrders
      parameters:
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/offsetParam"
        - $ref: "#/components/parameters/orderByParam"
        - $ref: "#/components/parameters/whereParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

    post:
      tags:
        - Sales Orders
      summary: CreateSalesOrder
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: CreateSalesOrder
      requestBody:
        required: true
        description: Create a new Sales Order
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

  /sales_orders/{sales_order_id}:
    get:
      tags:
        - Sales Orders
      summary: GetSalesOrder
      description: Get Sales Order by ID
      operationId: GetSalesOrderById
      parameters:
        - name: sales_order_id
          in: path
          description: ID of Sales Order to return
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

    put:
      tags:
        - Sales Orders
      summary: UpdateSalesOrder
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: UpdateSalesOrder
      parameters:
        - name: sales_order_id
          in: path
          description: ID of Sales Order to update
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        description: Update an existing Sales Order
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesOrderRequestBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesOrder"
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

  /sales_orders/{sales_order_id}/contents:
    get:
      tags:
        - Sales Orders
      summary: GetSalesOrderContents
      description: Get Sales Order Contents by Sales Order ID
      operationId: GetSalesOrderContentsById
      parameters:
        - name: sales_order_id
          in: path
          description: Sales Order ID
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/SalesOrderItem"
                    - type: object
                      properties:
                        weight_unit_id:
                          type: integer
                        weight_unit_name:
                          type: string
        "400":
          $ref: "#/components/responses/400BadRequest"
        "401":
          $ref: "#/components/responses/401NotAuthenticated"
        "403":
          $ref: "#/components/responses/403AccessDenied"
        "404":
          $ref: "#/components/responses/404NotFound"
        "500":
          $ref: "#/components/responses/500ServerError"

  /sales_orders/{sales_order_id}/payments:
    get:
      tags:
