  parameters:
    limitParam:
      name: limit
      in: query
      description: "Max number of records to return (optional). Cannot exceed 2000"
      required: false #default
      style: form # default
      schema:
        type: integer
        default: 2000
        example: 100

    offsetParam:
      name: offset
      in: query
      description: "Offset for the returned records (optional)"
      schema:
        type: integer
        default: 0
        example: 20

    orderByParam:
      name: order_by
      in: query
      description: "Order-by clause, in SQL format (optional)"
      schema:
        type: string
        example: id desc

    whereParam:
      name: where
      in: query
      description: |
        Filter results using SQL-like WHERE clause syntax (optional).

        **Supported operators**: =, >, <, >=, <=, BETWEEN, IN, LIKE, AND, OR

        **Supported patterns**:
        - Equality: `status='Active'`
        - Comparison: `updated_at >= '2024-01-01'`
        - Range: `id BETWEEN 1 AND 10000`
        - List: `status IN ('Active', 'Pending')`
        - Pattern: `sku LIKE 'ABC%'`
        - Compound: `facility_id=123 AND is_active=true`
      schema:
        type: string
        example: status='Active' AND updated_at >= '2024-01-01'

  responses:
    200Ok:
      description: OK
    400BadRequest:
      description: Bad request
    401NotAuthenticated:
      description: Not authenticated
    403AccessDenied:
      description: Access denied
    404NotFound:
      description: The specified resource was not found
    500ServerError:
      description: Server error

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header # can be "header", "query" or "cookie"
      name: X-API-KEY

security:
  - ApiKeyAuth: []
tags:
  - name: Canix API
    description: "Canix REST API"
