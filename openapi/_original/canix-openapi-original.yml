          example: [456, 789]
        sku:
          type: string
          example: "BD-001"
        notes:
          type: string
          example: "High-yield strain with excellent terpene profile"
        cbd_level:
          type: number
          format: float
          description: "CBD percentage level"
          example: 0.5
        thc_level:
          type: number
          format: float
          description: "THC percentage level"
          example: 18.5
        indica_percent:
          type: number
          format: float
          description: "Percentage of indica genetics"
          example: 40.0
        sativa_percent:
          type: number
          format: float
          description: "Percentage of sativa genetics"
          example: 60.0
        testing_status:
          type: string
          description: "Current testing status of the strain"
          example: "Tested"

    StrainRequestBody:
      title: Strain Request Body
