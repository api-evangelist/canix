          description: "ID of the brand"
        description:
          type: string
          example: "High quality strain"
          description: "Description of the item"
        notes:
          type: string
          example: "Internal notes about the item"
        sku:
          type: string
          example: "BD-001"
          description: "Stock keeping unit identifier"
        serving_size:
          type: string
          example: "1g"
          description: "Size of a single serving"
        number_of_doses:
          type: integer
          example: 10
          description: "Number of doses in the item"
        unit_thc_weight:
          type: number
          format: float
          example: 10.5
          description: "THC weight per unit"
        unit_cbd_weight:
          type: number
          format: float
          example: 5.2
          description: "CBD weight per unit"
        unit_thc_percent:
          type: number
          example: 18.5
          description: "THC percentage"
        unit_cbd_percent:
          type: number
          example: 2.5
          description: "CBD percentage"
        public_ingredients:
          type: string
          example: "Cannabis"
          description: "Public list of ingredients"
        supply_duration_days:
          type: integer
          example: 30
          description: "Duration of supply in days"
        administration_method:
          type: string
          example: "Oral"
          description: "Method of administration"
        photo_ids:
          type: array
          items:
            type: integer
          example: [1, 2, 3]
          description: "IDs of photos to associate with the item"
        metrc_item_brand:
          type: string
          example: "Brand #1"
          description: "Item Brand for METRC"

    ItemStandardCostRequestBody:
      title: Item Standard Cost Request Body
      type: object
      required:
        - cost
        - start_date
      properties:
        cost:
          type: number
          format: float
          description: The standard cost value to be set
          example: 10.50
        start_date:
          type: string
          format: date-time
          description: When this standard cost becomes effective
          example: "2024-02-03T00:00:00Z"
        end_date:
          type: string
          format: date-time
          description: Optional. When this standard cost expires
          example: "2024-12-31T23:59:59Z"

    JobRequestBody:
      title: Job Request Body
      type: object
      required:
        - job_type
        - facility_id
      properties:
        job_type:
          type: string
          example: "harvest"
        facility_id:
          type: integer
          example: 1
        parameters:
          type: object
          example: { "harvest_id": 123 }

    SalesOrderRequestBody:
      title: Sales Order Request Body
      type: object
      required:
        - customer_id
        - name
        - status
        - delivery_date
        - other_tax_rate
        - local_tax_rate
        - state_tax_rate
      properties:
        customer_id:
          description: The customer company id
          type: integer
          example: 2
        name:
          type: string
          example: "Order #123"
        external_identifier:
          type: string
          example: "SAP-ORDER-12345"
          description: External Sales Order ID (from partner system, not unique)
        status:
          type: string
          example: "pending"
        delivery_fee:
          type: number
          format: float
          example: 15.99
        delivery_date:
          type: string
          format: date-time
          example: "2025-02-04T14:00:00Z"
        payment_date:
          type: string
          format: date-time
          example: "2025-02-04T14:00:00Z"
        sales_order_credit:
          $ref: "#/components/schemas/Discount"
          description: >-
            Order-level discount. Despite the name, this behaves as a discount, not a credit:
            it is applied before taxes and reduces the taxable subtotal. To apply a post-tax
            customer credit, use `credits` instead.
          example:
            type: "percentage"
            amount: 25.0
            reason: "25% off"
        credits:
          type: number
          description: >-
            Post-tax customer credit to apply to the order, as a positive number. Unlike
            `sales_order_credit`, this does not reduce the taxable subtotal; taxes are
            calculated on the full subtotal and the credit is subtracted from the total
            afterwards. Omit the field to leave an existing credit unchanged on update.
          example: 1000.0
        pull_credit_from_customer:
          type: boolean
          description: >-
            Only used together with `credits`. When true, the credit is deducted from the
            customer's credit balance (see POST /customers/{customer_id}/credits) and the
            request fails if the balance is insufficient. Defaults to false, which applies
            the credit without affecting the customer's balance.
          example: false
        contents:
          type: array
          items:
            type: object
            required:
              - total_price
              - weight
              - weight_unit
            properties:
              item_id:
                type: integer
                example: 123
              non_cannabis_product_id:
                type: integer
                example: 456
              total_price:
                type: number
                format: float
                example: 25.99
              weight:
                type: number
                format: float
                example: 1.5
              weight_unit:
                type: string
                example: "grams"
              notes:
                type: string
                example: "Special handling required"
              package_ids:
                type: array
                items:
                  type: integer
                example: [1, 2, 3]
              discount:
                $ref: "#/components/schemas/Discount"
                example:
                  type: "fixed"
                  amount: 10.0
                  reason: "10$ off"
        payments:
          type: array
          items:
            type: object
            properties:
              amount:
                type: number
                format: float
                example: 100.00
              date:
                type: string
                format: date
                example: "2025-02-04"
              reference_number:
                type: string
                example: "PAY-123"
        other_tax_rate:
          type: number
          format: float
          example: 5.0
        local_tax_rate:
          type: number
          format: float
          example: 2.5
        state_tax_rate:
          type: number
          format: float
          example: 7.0
        internal_notes:
          type: string
          example: "Handle with care"
        payment_terms:
          type: string
          example: "Net 30"
        payment_notes:
          type: string
          example: "Payment due by end of month"
        terms_and_conditions:
          type: string
          example: "Standard terms apply"
        return_policy:
          type: string
          example: "30-day return policy"
        sales_rep_email:
          type: string
          example: "john.doe@example.com"
          description: "Email of the sales representative"

    StandardCostRequestBody:
      title: Standard Cost Request Body
      type: object
      required:
        - standard_cost_amount
        - effective_at
      properties:
        standard_cost_amount:
          type: number
          format: float
          example: 10.50
        effective_at:
          type: string
          format: date-time
          example: "2024-02-03T00:00:00Z"
        notes:
          type: string
          example: "Updated standard cost for Q1 2024"

    CreateStrainRequestBody:
      title: Strain Request Body
      type: object
      required:
