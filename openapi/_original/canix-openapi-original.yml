            street: 123 Cumberland St
            street2: West
            city: DL
            county: LN
            state: OK
            postal_code: 111001
          notes: great customer!
          outstanding_balance: 0
        delivery_date: "2021-05-24T19:58:00.000Z"
        delivery_fee: 2000
        payment_date: "2021-05-24T19:58:00.000Z"
        payment_terms: NET-14
        local_tax_rate: 0
        state_tax_rate: 0.27
        other_tax_rate: 0
        subtotal: 2124.22
        total_cultivation_tax: 0
        total_price: 2697.76
        total_paid: 100.00
        credits: 0
        discount: 0
        internal_notes: ""
        remaining_balance: 2597.76
        contents:
          - id: 100
            weight: 20
            weight_unit: Each
            unit_price: 20
            total_price: 400
            item:
              id: 7036
              name: Blue Dream - Trim
              sku: "22657"
            package_ids:
              - 123
              - 456
            discount:
              type: "fixed"
              amount: 10.0
              reason: "10$ off"
            updated_at: "2021-05-24T19:58:00.000Z"
            order: 1
        payments:
          - date: "2021-05-24T19:58:00.000Z"
            amount: 100
        sales_representative:
          id: 123,
          name: "John Doe"
          email: "j@d.com"
        sales_order_credit:
          type: "percentage"
          amount: 25.0
          reason: "25% off"
        display_status: "Pending Review"
        invoice_url: https://www.app.canix.com/sales/invoice/view/123456
        updated_at: "2021-05-24T19:58:00.000Z"

    SalesOrderItem:
      title: Sales Order Item
      required:
        - id
        - sales_order_id
      type: object
      properties:
        id:
          type: integer
        weight:
          type: number
        weight_unit:
          oneOf:
            - type: string
              description: Unit name or abbreviation
            - type: integer
              description: Unit id
        unit_price:
          type: number
        total_price:
          type: number
          description: Total price (unit * weight)
        item:
          $ref: "#/components/schemas/Sales_order_item"
        brand:
          allOf:
            - $ref: "#/components/schemas/IdName"
          nullable: true
          description: Brand of the sold item, product, or non-cannabis product (null if none)
        product_id:
          type: integer
          nullable: true
          description: ID of the linked cannabis Product, if any
        product_brand:
          allOf:
            - $ref: "#/components/schemas/IdName"
          nullable: true
          description: Brand of the linked cannabis Product, if any
        is_sample:
          type: boolean
          description: Whether the line item is a trade sample
        package_ids:
          type: array
          items:
            type: integer
        updated_at:
          type: string
          example: 2018-11-06T08:00:00.000Z
        order:
          type: integer
          description: Position of the item in the order
        discount:
          $ref: "#/components/schemas/Discount"
      example:
        id: 100
        weight: 20
        weight_unit: Each
        unit_price: 20
        total_price: 400
        item:
          id: 7036
          name: Blue Dream - Trim
          sku: "22657"
        brand:
          id: 12
          name: Sunshine Co
        product_id: 4500
        product_brand:
          id: 12
          name: Sunshine Co
        is_sample: false
        package_ids:
          - 123
          - 456
        discount:
          type: "percentage"
          amount: 25.0
          reason: "25% off"
        updated_at: "2021-05-24T19:58:00.000Z"
        order: 1

    Discount:
      title: Discount
      type: object
      properties:
        type:
          type: string
          enum: ["fixed", "percentage"]
        amount:
          type: number
        reason:
          type: string
      example:
        type: "fixed"
        amount: 10.0
        reason: "Black Friday Sale"

    SalesOrderPayment:
      title: Sales Order Payment
      required:
        - amount
        - date
      type: object
      properties:
        id:
          type: integer
        sales_order_id:
          type: integer
          description: ID of the sales order this payment was applied to
        amount:
          type: number
        date:
          type: integer
        reference_number:
          type: string
          nullable: true
          description: Payment reference number
        external_transaction_name:
          type: string
          nullable: true
          description: Readable name of the linked external (e.g. accounting) transaction
        updated_at:
          type: string
          example: 2018-11-06T08:00:00.000Z
      example:
        id: 9001
        sales_order_id: 584857
        amount: 10000
        date: "2021-05-24T19:58:00.000Z"
        reference_number: "CHK-1042"
        external_transaction_name: "QBO Payment #55"
        updated_at: "2021-05-24T19:58:00.000Z"

    Submission:
      title: Submission
      description: |
        A submission represents an asynchronous action (such as creating a package, adjusting inventory,
        submitting a transfer, etc.) that may be pending, successful, failed, or require approval.
      type: object
      required:
        - uuid
        - status
        - created_at
      properties:
        uuid:
          type: string
          description: The unique identifier for the submission
          example: "U3VibWlzc2lvbjo0NTY3ODk="
        status:
          $ref: "#/components/schemas/SubmissionStatus"
        readable_name:
          type: string
          nullable: true
          description: Human-readable name describing the submission action
          example: "Create Package"
        description:
          type: string
          description: Detailed description of the submission, may include multiple lines
          example: "Package created from harvest\nTag: 1A40000000000000001"
        error_message:
          type: string
          description: Error message if the submission failed, empty string otherwise
          example: ""
        result:
          type: object
          nullable: true
          description: Result data from a successful submission (e.g., created record IDs)
          additionalProperties: true
          example:
            package_id: 12345
            tag: "1A40000000000000001"
        created_at:
          type: string
          format: date-time
          description: When the submission was created
          example: "2024-01-15T10:30:00.000Z"
        last_run_at:
          type: string
          format: date-time
          nullable: true
          description: When the submission was last executed (null if not yet run)
          example: "2024-01-15T10:30:05.000Z"
      example:
        uuid: "U3VibWlzc2lvbjo0NTY3ODk="
        status: "SUCCESS"
        readable_name: "Create Package"
        description: "Package created from harvest\nTag: 1A40000000000000001"
        error_message: ""
        result:
          package_id: 12345
          tag: "1A40000000000000001"
        created_at: "2024-01-15T10:30:00.000Z"
        last_run_at: "2024-01-15T10:30:05.000Z"

    SubmissionStatus:
      title: Submission Status
      type: string
      description: |
        The current status of the submission:
        - **CREATED**: Transaction queued for processing
        - **PENDING_APPROVAL**: Transaction awaiting admin approval
        - **PENDING**: Transaction pending response from compliance system
        - **RETRYING**: Transaction failed but will be automatically retried
        - **FAILED**: Transaction failed permanently
        - **SUCCESS**: Transaction completed successfully
        - **DENIED**: Transaction was reviewed by an admin and denied
        - **ABORTED**: Transaction has been aborted
        - **PARTIAL_FAILURE**: Some steps succeeded but others failed
      enum:
        - CREATED
        - PENDING_APPROVAL
        - PENDING
        - RETRYING
        - FAILED
        - SUCCESS
        - DENIED
        - ABORTED
        - PARTIAL_FAILURE
      example: "SUCCESS"

    CreatePurchaseOrderRequestBody:
      title: Purchase Order Request Body
      required:
        - facility_id
        - vendor_id
        - status
        - requested_delivery_date
        - payment_terms
      type: object
      properties:
        facility_id:
          type: integer
          example: 1
          description: Facility ID (fk)
        name:
          type: string
          example: PO 00001
          description: Optional name for the purchase order
        status:
          type: string
          enum: ["CREATED", "RELEASED", "REQUESTED", "PARTIALLY_RECEIVED", "RECEIVED", "PAID", "ARCHIVED"]
          description: Status of the purchase order
        vendor_id:
          type: integer
          example: 123
          description: Vendor ID (fk)
        requested_delivery_date:
          type: string
          format: date
          example: "2021-06-07"
          description: Expected delivery date for the purchase order
        internal_notes:
          type: string
          example: Follow up
          description: Optional internal notes for the purchase order
        payment_terms:
          type: string
          pattern: "^(NET|COD|CONSIGNMENT|PREPAYMENT)"
          example: NET15
          description: Payment terms - must start with one of 'NET', 'COD', 'CONSIGNMENT', 'PREPAYMENT'
        payment_date:
          type: string
          format: date
          example: "2021-06-22"
          description: Date when the Purchase Order was paid. Required if payment_terms is PREPAYMENT
        delivery_fee:
          type: number
          format: float
          minimum: 0
          example: 1.50
          description: Optional delivery fee amount
        local_tax_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.01
          description: Input 0.01 to represent 1% tax rate. Will enable excise_tax if greater than 0
        state_tax_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.01
          description: Input 0.01 to represent 1% tax rate. Will enable excise_tax if greater than 0
        other_tax_rate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          example: 0.01
          description: Input 0.01 to represent 1% tax rate
        purchase_order_items_attributes:
          description: Contents of the order (i.e. line items)
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItemRequestBody"

    PurchaseOrder:
      title: Purchase Order
      required:
        - id
        - facility_id
        - name
        - status
        - requested_delivery_date
        - other_tax_rate
        - local_tax_rate
        - state_tax_rate
      type: object
      properties:
        id:
          type: integer
          example: 350
        facility_id:
          type: integer
          example: 1
          description: Facility ID (fk)
        name:
          type: string
          example: PO 00001
        status:
          type: string
          description: >-
            status, can be one of: 'CREATED', 'RELEASED', 'REQUESTED', 'PARTIALLY_RECEIVED', 'RECEIVED', 'PAID',
            'ARCHIVED'
        vendor:
          $ref: "#/components/schemas/Vendor"
        requested_delivery_date:
          type: string
          example: "2021-06-07T07:00:00.000Z"
        internal_notes:
          type: string
          example: Follow up
        payment_terms:
          type: string
          example: NET15
          description: Has to start with one of 'NET', 'COD', 'CONSIGNMENT', 'PREPAYMENT'
        payment_date:
          type: string
          example: "2021-06-22"
          description: Date when the Purchase Order was paid. (Required if payment_terms is PREPAYMENT)
        delivery_fee:
          type: number
          example: 1.50
        local_tax_rate:
          type: number
          example: 0.01
          description: Input 0.01 to represent 1% tax rate
        state_tax_rate:
          type: number
          example: 0.01
          description: Input 0.01 to represent 1% tax rate
        other_tax_rate:
          type: number
          example: 0.01
          description: Input 0.01 to represent 1% tax rate
        subtotal:
          type: number
          description: Subtotal of all items
        # total_cultivation_tax:   # not ready yet
        #   type: number
        total_price:
          type: number
          description: Total price (with taxes)
        total_paid:
          type: number
        payments:
          description: Payments for this order
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderPayment"
        contents:
          description: Contents of the order (i.e. line items)
          type: array
          items:
            $ref: "#/components/schemas/PurchaseOrderItem"
        created_at:
          type: string
          description: Timestamp that the record was created in Canix
        updated_at:
          type: string
          example: 2018-11-06T08:00:00.000Z

    PurchaseOrderItemRequestBody:
      title: Purchase Order Item Request Body
      required:
        - weight
        - weight_unit_id
        - price
      type: object
      properties:
        item_id:
          type: integer
          example: 7036
          description: Item ID (fk). Mutually exclusive with non_cannabis_product_id - exactly one of the two is required per line item.
        non_cannabis_product_id:
          type: integer
          example: 145
          description: Non-Cannabis Product ID (fk). Mutually exclusive with item_id - exactly one of the two is required per line item.
        weight:
          type: number
          example: 200
        weight_unit_id:
          type: integer
          example: 15
          description: Weight Unit ID (fk)
        price:
          type: number
          example: 10.25
          description: Total price for that item weight
        notes:
          type: string
          example: my notes for this order item
          description: Note to describe the order item

    PurchaseOrderItem:
