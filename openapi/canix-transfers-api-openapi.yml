        invoice_url: https://www.app.canix.com/sales/invoice/view/123456
        updated_at: '2021-05-24T19:58:00.000Z'
    ParentLocation:
      title: Parent Location
      required:
      - id
      - name
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: Pro System
        sqft:
          type: number
          example: 14.4
        num_lights:
          type: integer
          example: 42
        updated_at:
          type: string
          example: 2018-11-06 08:00:00+00:00
        is_active:
          type: boolean
          example: true
    Package:
      title: Package
      required:
      - id
      type: object
      properties:
        id:
          type: integer
        tag:
          type: string
        is_active:
          type: boolean
        is_testing_package:
          type: boolean
          description: Whether the package is flagged as a testing (lab sample) package.
        status:
          type: string
        item:
          $ref: '#/components/schemas/Item'
        weight:
          type: number
        original_weight:
          type: number
        weight_unit:
          type: string
        packaged_date:
          type: string
        production_batch_date:
          type:
          - string
          - 'null'
          format: date
          description: The production batch date for the package.
        expiration_date:
          type: string
        received_date:
