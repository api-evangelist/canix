openapi: 3.2.0
info:
  title: Canix Strains API
  x-logo:
    url: https://assets.website-files.com/5ee52a0f4be6ffc2aaeb52cd/5ee52a0f4be6ff20e7eb534f_canix-logo.svg
    backgroundColor: '#FFFFFF'
    altText: Canix logo
  description: '# Introduction

    This API documentation describes the endpoints used by third-party developers to get Canix data for their account.

    # Authentication

    Canix API uses API Keys for authentication. You can generate an API key on our API page, and on your API requests use the `X-API-KEY` header with the API key value you generated.

    We strongly recommend using a secrets manager. Plain text files like dotenv lead to accidental costly leaks. Use Doppler or similar options for a developer friendly experience. AWS and Google Cloud have native solutions as well.'
  contact:
    name: Canix Support
    url: https://help.canix.com/
    email: help@canix.com
  version: 1.3.11
servers:
- url: https://api.canix.com/api/v1
  variables: {}
security:
- ApiKeyAuth: []
tags:
- name: Strains
paths:
  /strains:
    get:
      tags:
      - Strains
      summary: GetStrains
      description: Return active Strains
      operationId: GetStrains
      parameters:
      - name: facility_id
        in: query
        description: Facility ID (optional)
        example: 123
        required: false
        schema:
          type: integer
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/offsetParam'
      - $ref: '#/components/parameters/orderByParam'
      - $ref: '#/components/parameters/whereParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Strain'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    post:
      tags:
      - Strains
      summary: CreateStrain
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: CreateStrain
      requestBody:
        required: true
        description: Create a new Strain
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStrainRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strain'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
  /strains/{strain_id}:
    get:
      tags:
      - Strains
      summary: GetStrain
      description: Get Strain by ID
      operationId: GetStrainById
      parameters:
      - name: strain_id
        in: path
        description: Strain ID
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strain'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    put:
      tags:
      - Strains
      summary: UpdateStrain
      description: __CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__
      operationId: UpdateStrain
      parameters:
      - name: strain_id
        in: path
        description: ID of Strain to update
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        description: Update an existing Strain
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrainRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Strain'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500ServerError'
    delete:
      tags:
      - Strains
      summary: DeleteStrain
      description: '__CALLING THIS ENDPOINT WILL MODIFY YOUR DATA IRREVERSIBLY. ONLY CALL THIS ON SANDBOX DATA DURING DEVELOPMENT/CODING/TESTING.__


        Deletion is routed through a submission, so the response tells you how far it got. A `200` means the

        submission finished and the strain is included in its deleted state; a `202` means the submission is still

        being processed and only the submission is returned — poll it with `GET /submissions/{submission_id}`.'
      operationId: DeleteStrain
      parameters:
      - name: strain_id
        in: path
        description: ID of Strain to delete
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: The submission succeeded and the strain was deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrainDeletionResult'
        '202':
          description: The submission was queued and has not finished yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrainDeletionResult'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401NotAuthenticated'
        '403':
          $ref: '#/components/responses/403AccessDenied'
        '404':
          $ref: '#/components/responses/404NotFound'
        '422':
          description: The submission failed; `submission.error_message` carries the reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StrainDeletionResult'
        '500':
          $ref: '#/components/responses/500ServerError'
components:
  schemas:
    StrainRequestBody:
      title: Strain Request Body
      description: All fields are optional; only the keys present in the payload are updated, and an explicit null clears the stored value.
      type: object
      properties:
        name:
          type: string
          example: Blue Dream
        sku:
          type:
          - string
          - 'null'
          example: BD-001
        notes:
          type:
          - string
          - 'null'
          example: High-yield strain with excellent terpene profile
        cbd_level:
          type:
          - number
          - 'null'
          format: float
          description: CBD percentage level
          example: 0.5
        thc_level:
          type:
          - number
          - 'null'
          format: float
          description: THC percentage level
          example: 18.5
        indica_percent:
          type:
          - number
          - 'null'
          format: float
          description: Percentage of indica genetics
          example: 40.0
        sativa_percent:
          type:
          - number
          - 'null'
          format: float
          description: Percentage of sativa genetics
          example: 60.0
        indica_percentage:
          type:
          - number
          - 'null'
          format: float
          description: Alias of indica_percent, matching the field name in strain responses. Ignored when indica_percent is also sent.
          example: 40.0
        sativa_percentage:
          type:
          - number
          - 'null'
          format: float
          description: Alias of sativa_percent, matching the field name in strain responses. Ignored when sativa_percent is also sent.
          example: 60.0
        testing_status:
          type:
          - string
          - 'null'
          description: Current testing status of the strain
          example: Tested
        cross_strain_ids:
          type:
          - array
          - 'null'
          description: Array of strain IDs that are crossed with this strain. All cross strains must belong to the same facility. Replaces the existing cross strains; null clears them.
          items:
            type: integer
          example:
          - 456
          - 789
    SubmissionStatus:
      title: Submission Status
      type: string
      description: 'The current status of the submission:

        - **CREATED**: Transaction queued for processing

        - **PENDING_APPROVAL**: Transaction awaiting admin approval

        - **PENDING**: Transaction pending response from compliance system

        - **RETRYING**: Transaction failed but will be automatically retried

        - **FAILED**: Transaction failed permanently

        - **SUCCESS**: Transaction completed successfully

        - **DENIED**: Transaction was reviewed by an admin and denied

        - **ABORTED**: Transaction has been aborted

        - **PARTIAL_FAILURE**: Some steps succeeded but others failed

        '
      enum:
      - CREATED
      - PENDING_APPROVAL
      - PENDING
      - RETRYING
      - FAILED
      - SUCCESS
      - DENIED
      - ABORTED
      - PARTIAL_FAILURE
      example: SUCCESS
    Strain:
      title: Strain
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
          example: Lemon Skunk
          description: Strain name
        facility_id:
          type: integer
          example: 123
          description: ID of the facility the strain belongs to
        notes:
          type: string
          example: Terpenes .63%
          description: Notes
        sku:
          type: string
          example: BIOJJ
          description: SKU
        testing_status:
          type: string
          example: InHouse
          description: 'Testing status: InHouse, ThirdParty, None, NA'
        indica_percent:
          type:
          - number
          - 'null'
          example: 45.0
          description: Indica Percentage
        sativa_percent:
          type:
          - number
          - 'null'
          example: 55.0
          description: Sativa Percentage
        indica_percentage:
          type:
          - number
          - 'null'
          example: 45.0
          description: Indica Percentage (same value as indica_percent)
        sativa_percentage:
          type:
          - number
          - 'null'
          example: 55.0
          description: Sativa Percentage (same value as sativa_percent)
        cross_strains:
          type: array
          description: Cross strains
          items:
            $ref: '#/components/schemas/CrossStrain'
        updated_at:
          type: string
          format: date-time
          description: Timestamp of the last update
    StrainDeletionResult:
      title: Strain Deletion Result
      description: 'The outcome of a strain deletion. `strain` is only present once the submission has succeeded, so a `202`

        response carries the submission alone.

        '
      type: object
      required:
      - submission
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        strain:
          $ref: '#/components/schemas/Strain'
    CrossStrain:
      title: Cross Strain
      required:
      - id
      - name
      properties:
        id:
          type: integer
        name:
          type: string
          example: Lemon Skunk
          description: Strain name
    CreateStrainRequestBody:
      title: Strain Request Body
      type: object
      required:
      - name
      properties:
        facility_id:
          type: integer
          description: ID of the facility where the strain will be created
          example: 123
        name:
          type: string
          example: Blue Dream
        cross_strain_ids:
          type: array
          description: Array of strain IDs that are crossed with this strain. All cross strains must belong to the same facility.
          items:
            type: integer
          example:
          - 456
          - 789
        sku:
          type: string
          example: BD-001
        notes:
          type: string
          example: High-yield strain with excellent terpene profile
        cbd_level:
          type: number
          format: float
          description: CBD percentage level
          example: 0.5
        thc_level:
          type: number
          format: float
          description: THC percentage level
          example: 18.5
        indica_percent:
          type: number
          format: float
          description: Percentage of indica genetics
          example: 40.0
        sativa_percent:
          type: number
          format: float
          description: Percentage of sativa genetics
          example: 60.0
        indica_percentage:
          type: number
          format: float
          description: Alias of indica_percent, matching the field name in strain responses. Ignored when indica_percent is also sent.
          example: 40.0
        sativa_percentage:
          type: number
          format: float
          description: Alias of sativa_percent, matching the field name in strain responses. Ignored when sativa_percent is also sent.
          example: 60.0
        testing_status:
          type: string
          description: Current testing status of the strain
          example: Tested
    Submission:
      title: Submission
      description: 'A submission represents an asynchronous action (such as creating a package, adjusting inventory,

        submitting a transfer, etc.) that may be pending, successful, failed, or require approval.

        '
      type: object
      required:
      - uuid
      - status
      - created_at
      properties:
        uuid:
          type: string
          description: The unique identifier for the submission
          example: U3VibWlzc2lvbjo0NTY3ODk=
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        readable_name:
          type:
          - string
          - 'null'
          description: Human-readable name describing the submission action
          example: Create Package
        description:
          type: string
          description: Detailed description of the submission, may include multiple lines
          example: 'Package created from harvest

            Tag: 1A40000000000000001'
        error_message:
          type: string
          description: Error message if the submission failed, empty string otherwise
          example: ''
        result:
          type:
          - object
          - 'null'
          description: Result data from a successful submission (e.g., created record IDs)
          additionalProperties: true
          example:
            package_id: 12345
            tag: 1A40000000000000001
        created_at:
          type: string
          format: date-time
          description: When the submission was created
          example: '2024-01-15T10:30:00.000Z'
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the submission was last executed (null if not yet run)
          example: '2024-01-15T10:30:05.000Z'
      example:
        uuid: U3VibWlzc2lvbjo0NTY3ODk=
        status: SUCCESS
        readable_name: Create Package
        description: 'Package created from harvest

          Tag: 1A40000000000000001'
        error_message: ''
        result:
          package_id: 12345
          tag: 1A40000000000000001
        created_at: '2024-01-15T10:30:00.000Z'
        last_run_at: '2024-01-15T10:30:05.000Z'
  parameters:
    whereParam:
      name: where
      in: query
      description: 'Filter results using SQL-like WHERE clause syntax (optional).


        **Supported operators**: =, >, <, >=, <=, BETWEEN, IN, LIKE, AND, OR


        **Supported patterns**:

        - Equality: `status=''Active''`

        - Comparison: `updated_at >= ''2024-01-01''`

        - Range: `id BETWEEN 1 AND 10000`

        - List: `status IN (''Active'', ''Pending'')`

        - Pattern: `sku LIKE ''ABC%''`

        - Compound: `facility_id=123 AND is_active=true`

        '
      schema:
        type: string
        example: status='Active' AND updated_at >= '2024-01-01'
    orderByParam:
      name: order_by
      in: query
      description: Order-by clause, in SQL format (optional)
      schema:
        type: string
        example: id desc
    limitParam:
      name: limit
      in: query
      description: Max number of records to return (optional). Cannot exceed 2000
      required: false
      style: form
      schema:
        type: integer
        default: 2000
        example: 100
    offsetParam:
      name: offset
      in: query
      description: Offset for the returned records (optional)
      schema:
        type: integer
        default: 0
        example: 20
  responses:
    500ServerError:
      description: Server error
    403AccessDenied:
      description: Access denied
    400BadRequest:
      description: Bad request
    401NotAuthenticated:
      description: Not authenticated
    404NotFound:
      description: The specified resource was not found
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
