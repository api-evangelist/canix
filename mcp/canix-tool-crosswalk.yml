mcp_only:
- tool: (unknown)
  reason: Canix markets the MCP server as answering analytical, period-over-period questions ("revenue
    last month vs prior month", "accounts that have not ordered in 30 days"). The REST API exposes no
    aggregation, grouping or time-bucketing operation — only row retrieval with limit/offset/order_by/where
    — so at least some MCP capability is a server-side composite with no REST equivalent. The tools cannot
    be named because tools/list is gated.
