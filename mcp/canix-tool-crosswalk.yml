description: Canix runs both a public REST API (OpenAPI 3.0.3, 74 operations) and a hosted MCP server,
  so the two agent surfaces are crosswalked here. The MCP tool list is NOT public — tools/list returns
  401 and Canix publishes no manifest, no llms.txt and no configuration snippet — so crosswalk[] is deliberately
  EMPTY rather than populated with invented tool names. What can be recorded honestly is the mapping from
  the capabilities Canix describes in prose to the REST operations that back the same data, at low confidence.
